services:
  - type: web
    name: compsuo-api-staging
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: compsuo-db-staging
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6
      - key: BOOTSTRAP_ADMIN_TOKEN
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_API_URL
        value: https://compsuo-api-staging.onrender.com
      - key: DASHBOARD_URL
        value: https://compsuo-dashboard-staging.onrender.com
      - key: QUICKBOOKS_CLIENT_ID
        sync: false
      - key: QUICKBOOKS_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_ENVIRONMENT
        value: sandbox
      - key: QUICKBOOKS_REDIRECT_URI
        value: https://compsuo-api-staging.onrender.com/api/integrations/quickbooks/callback
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://compsuo-dashboard-staging.onrender.com,https://compsuo-dashboard.onrender.com,http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8000
      - key: PRICE_CREEP_ALERT_PERCENT
        value: "8"

  - type: cron
    name: compsuo-daily-scan-staging
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.daily_scan
    schedule: "*/15 * * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: compsuo-db-staging
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6
      - key: GOOGLE_MAPS_API_KEY
        sync: false

  - type: web
    name: compsuo-dashboard-staging
    runtime: static
    rootDir: frontend
    buildCommand: echo "Serving COMPSUO staging dashboard"
    staticPublishPath: .

databases:
  - name: compsuo-db-staging
