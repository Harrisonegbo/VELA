services:
  - type: web
    name: vela-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vela-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6
      - key: BOOTSTRAP_ADMIN_TOKEN
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_API_URL
        value: https://vela-api.onrender.com
      - key: DASHBOARD_URL
        value: https://vela-dashboard.onrender.com
      - key: QUICKBOOKS_CLIENT_ID
        sync: false
      - key: QUICKBOOKS_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_ENVIRONMENT
        value: production
      - key: QUICKBOOKS_REDIRECT_URI
        value: https://vela-api.onrender.com/api/integrations/quickbooks/callback
      - key: CORS_ORIGINS
        value: https://vela-dashboard.onrender.com
      - key: PRICE_CREEP_ALERT_PERCENT
        value: "8"

  - type: cron
    name: vela-daily-scan
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.daily_scan
    schedule: "0 6 * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vela-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6

  - type: web
    name: vela-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: echo "Serving VÈLA dashboard"
    staticPublishPath: .

databases:
  - name: vela-db
